title: Schtasks.exe Used to Create or Modify Scheduled Task
id: 7e1b5d3a-4f8c-4a2e-c6d9-1b4e7f0a3c8d
status: experimental
description: Detects the use of schtasks.exe with task creation or modification arguments. Schtasks.exe is a built-in Windows utility commonly used by attackers to register malicious scheduled tasks programmatically from the command line. This technique is frequently observed in scripted or automated post-exploitation activity and may be combined with encoded commands or references to unusual execution paths.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks
author: dcrowder252
date: 2026/05/24
modified: 2026/05/24
tags:
    - attack.persistence
    - attack.t1053.005
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith:
            - '\schtasks.exe'
    selection_args:
        CommandLine|contains:
            - ' /create '
            - ' /change '
    condition: selection_process and selection_args
falsepositives:
    - Legitimate software installations that use schtasks.exe to register scheduled tasks
    - Administrative scripts that create or modify scheduled tasks for approved automation workflows
    - Software update mechanisms that invoke schtasks.exe during updates
    - Establish a baseline of approved schtasks.exe usage before alerting
level: medium
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - ComputerName
