title: Scheduled Task Modified
id: 3a7c1e5f-8d2b-4f6a-b3e9-7d0c4a2f8b1e
status: experimental
description: Detects the modification of an existing scheduled task via Windows Event ID 4702. Attackers may modify existing legitimate scheduled tasks rather than creating new ones in an effort to blend malicious activity into trusted task definitions. Unexpected modifications should be reviewed against the expected baseline for the environment with particular attention paid to changes in task actions, triggers, or execution context.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4702
author: dcrowder252
date: 2026/05/24
modified: 2026/05/24
tags:
    - attack.persistence
    - attack.t1053.005
    - attack.defense_evasion
    - attack.t1036
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4702
    condition: selection
falsepositives:
    - Legitimate software updates that modify existing scheduled tasks as part of their update process
    - Administrative scripts that update scheduled task definitions for approved automation workflows
    - Establish a baseline of approved scheduled task modification activity before alerting
level: medium
fields:
    - EventID
    - SubjectUserName
    - SubjectDomainName
    - TaskName
    - TaskContent
    - ComputerName
