title: PowerShell Execution Policy Bypass
id: 9c4b1d7e-2a6f-4c3e-b8d5-7f0e2a9c1b4d
status: experimental
description: Detects PowerShell processes launched with execution policy bypass flags, which are commonly used by attackers to override script execution restrictions without requiring administrative privileges or persistent changes to system configuration.
references:
    - https://attack.mitre.org/techniques/T1059/001/
    - https://redcanary.com/threat-detection-report/techniques/powershell/
author: dcrowder252
date: 2026/05/04
modified: 2026/05/04
tags:
    - attack.execution
    - attack.t1059.001
    - attack.defense_evasion
    - attack.t1562
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_bypass:
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - '-ExecutionPolicy Unrestricted'
            - '-ExecutionPolicy Hidden'
            - '-ep bypass'
            - '-ep unrestricted'
            - '-ep hidden'
    condition: selection_process and selection_bypass
falsepositives:
    - Legitimate administrative scripts that explicitly set execution policy for authorized automation tasks
    - Software installation processes that invoke PowerShell with bypass flags
    - Known remote management or deployment tools — establish a baseline of approved usage before alerting
level: medium
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - ComputerName
