title: Shadow Copy Deletion via PowerShell
id: 3b7f1e4a-2d8c-4b9f-a6e3-5c1d0f3b8e2a
status: experimental
description: Detects PowerShell commands used to delete Volume Shadow Copies via WMI. This technique was observed in the BumbleBee/Akira campaign where the Akira ransomware binary automated shadow copy deletion upon execution to prevent recovery of encrypted files. This activity is a strong ransomware precursor indicator and should be treated as a critical alert when observed.
references:
    - https://attack.mitre.org/techniques/T1490/
    - https://thedfirreport.com/2026/06/29/from-bing-search-to-ransomware-bumblebee-and-adaptixc2-deliver-akira-3/
author: dcrowder252
date: 2026/07/06
modified: 2026/07/06
tags:
    - attack.impact
    - attack.t1490
    - attack.defense_evasion
    - attack.t1070
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_args:
        CommandLine|contains|all:
            - 'Win32_Shadowcopy'
            - 'Remove-WmiObject'
    condition: selection_process and selection_args
falsepositives:
    - Legitimate backup management scripts that remove old shadow copies as part of approved storage management workflows
    - Establish a baseline of approved shadow copy management activity before alerting
level: critical
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - ComputerName
