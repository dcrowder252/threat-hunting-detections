title: wab.exe Executing From Non-Standard Path
id: 4f2e8b1a-7d3c-4a9e-c5f8-6b1d0e3a7f2c
status: experimental
description: Detects wab.exe executing from a non-standard location. The legitimate path for wab.exe is Program Files\Windows Mail — not System32. This technique was observed in the BumbleBee campaign where wab.exe was used as a sideloading host from AppData. WinSxS and Program Files\Windows Mail are excluded as known legitimate locations.
references:
    - https://attack.mitre.org/techniques/T1574/001/
    - https://thedfirreport.com/2026/06/29/from-bing-search-to-ransomware-bumblebee-and-adaptixc2-deliver-akira-3/
author: dcrowder252
date: 2026/07/06
modified: 2026/07/06
tags:
    - attack.defense_evasion
    - attack.t1574.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\wab.exe'
    filter_legit:
        Image|contains:
            - '\Program Files\Windows Mail\'
            - '\Windows\WinSxS\'
    condition: selection and not filter_legit
falsepositives:
    - Legitimate use of wab.exe from approved paths not covered by the exclusion filter
    - Establish a baseline of expected wab.exe execution paths before alerting
level: high
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - ComputerName
