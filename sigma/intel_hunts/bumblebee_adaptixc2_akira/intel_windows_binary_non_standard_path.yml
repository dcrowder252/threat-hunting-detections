title: consent.exe Executing From Non-Standard Path
id: 1a3f7e2d-9c4b-4e8f-b6d5-2c0a1f9e3b7d
status: experimental
description: Detects consent.exe executing from a non-standard location outside of System32 and WinSxS. This technique was observed in the BumbleBee campaign where consent.exe was staged in a temp directory to facilitate DLL sideloading of a malicious msimg32.dll.
references:
    - https://attack.mitre.org/techniques/T1574/001/
    - https://thedfirreport.com/2026/06/29/from-bing-search-to-ransomware-bumblebee-and-adaptixc2-deliver-akira-3/
author: dcrowder252
date: 2026/07/06
modified: 2026/07/06
tags:
    - attack.defense_evasion
    - attack.t1574.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\consent.exe'
    filter_legit:
        Image|contains:
            - '\Windows\System32\'
            - '\Windows\WinSxS\'
    condition: selection and not filter_legit
falsepositives:
    - Legitimate software installations that may temporarily stage consent.exe in non-standard locations
    - Establish a baseline of expected execution paths before alerting
level: high
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - ComputerName

