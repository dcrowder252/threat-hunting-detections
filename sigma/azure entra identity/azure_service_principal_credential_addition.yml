title: Azure Service Principal or Application Credential Addition
id: 2f8a4e1d-7c3b-4f9e-a6d5-1b0e3f7a2c8d
status: experimental
description: Detects the addition of new credentials to Azure service principals or applications. Attackers who gain sufficient privileges frequently add new secrets or certificates to existing trusted applications to establish persistent backdoors that survive password resets and account remediation. Unlike user sessions which expire, application credentials remain valid until explicitly revoked.
references:
    - https://attack.mitre.org/techniques/T1098/001/
author: dcrowder252
date: 2026/07/20
modified: 2026/07/20
tags:
    - attack.persistence
    - attack.t1098.001
logsource:
    product: azure
    service: auditlogs
detection:
    selection:
        operationName:
            - 'Add service principal credentials'
            - 'Update application – Certificates and secrets management'
            - 'Add password credential to service principal'
            - 'Add key credential to service principal'
        status: 'success'
    condition: selection
falsepositives:
    - Legitimate administrative credential additions during approved change management windows
    - Automated DevOps pipelines that rotate application credentials as part of approved workflows
    - Establish a baseline of approved credential management activity before alerting
level: high
fields:
    - operationName
    - status
    - callerIpAddress
    - user
