title: Linux Logging Service Stopped or Disabled
id: 8e1c5a3f-4d7b-4f2e-b9a6-5c3d1f8e0b2a
status: experimental
description: Detects commands used to stop or disable logging services on Linux systems including rsyslog, syslog, and auditd. Attackers with sufficient privileges may attempt to stop logging services to prevent ongoing activity from being recorded. This technique is often observed in combination with other log clearing techniques and should be treated as suspicious when observed outside of approved maintenance windows.
references:
    - https://attack.mitre.org/techniques/T1070/002/
    - https://attack.mitre.org/techniques/T1562.001/
author: dcrowder252
date: 2026/05/25
modified: 2026/05/25
tags:
    - attack.defense_evasion
    - attack.t1070.002
    - attack.t1562.001
logsource:
    category: process_creation
    product: linux
detection:
    selection_systemctl:
        Image|endswith:
            - '/systemctl'
        CommandLine|contains:
            - 'stop rsyslog'
            - 'stop syslog'
            - 'stop auditd'
            - 'disable rsyslog'
            - 'disable auditd'
            - 'disable syslog'
    selection_service:
        Image|endswith:
            - '/service'
        CommandLine|contains:
            - 'rsyslog stop'
            - 'syslog stop'
            - 'auditd stop'
    condition: selection_systemctl or selection_service
falsepositives:
    - Legitimate administrative activity stopping or disabling logging services during approved maintenance windows
    - System administrators reconfiguring logging infrastructure as part of planned changes
    - Establish a baseline of approved logging service management activity before alerting
level: high
fields:
    - CommandLine
    - ParentCommandLine
    - User
    - Hostname
