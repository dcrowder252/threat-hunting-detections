title: Windows Event Log Cleared
id: 8d1f4a2e-9c3b-4e6d-b7a5-4f2c1e8d0b6a
status: experimental
description: Detects the clearing of any Windows Event Log via Event ID 104. This event is generated by the Event Log service whenever a log is cleared and may indicate an attacker attempting to remove evidence of malicious activity from the System, Application, or other Windows Event Logs.
references:
    - https://attack.mitre.org/techniques/T1070/001/
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-1102
author: dcrowder252
date: 2026/05/06
modified: 2026/05/06
tags:
    - attack.defense_evasion
    - attack.t1070.001
logsource:
    product: windows
    service: system
detection:
    selection:
        EventID: 104
    condition: selection
falsepositives:
    - Legitimate administrative log clearing during approved maintenance windows
    - Automated log management processes that clear logs as part of routine operations
    - Establish a baseline of approved log clearing activity before alerting
level: high
fields:
    - EventID
    - Channel
    - SubjectUserName
    - SubjectDomainName
    - SubjectLogonId
    - ComputerName
