title: Certutil Referencing External URL
id: 6b2e9f4a-3d1c-4e8f-c5a7-2b0e6f9d3a1c
status: experimental
description: Detects certutil invocations where the command line contains external URLs. This covers scenarios where an attacker uses certutil to contact remote infrastructure for payload retrieval without necessarily including the -urlcache or -split flags. Any certutil invocation referencing an external URL outside of specific PKI management scenarios warrants investigation.
references:
    - https://attack.mitre.org/techniques/T1105/
    - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: dcrowder252
date: 2026/10/01
modified: 2026/10/01
tags:
    - attack.command_and_control
    - attack.t1105
    - attack.defense_evasion
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith: '\certutil.exe'
    selection_url:
        CommandLine|contains:
            - 'http://'
            - 'https://'
    condition: selection_process and selection_url
falsepositives:
    - Legitimate PKI management operations that reference external certificate authority URLs
    - Establish a baseline of approved certutil usage before alerting
level: high
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - ComputerName
