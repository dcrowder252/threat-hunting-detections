title: Msiexec Silent Execution from Suspicious Path
id: 7a1d4f8e-2c3b-4e9a-b6f5-1d0c7f2b4e8a
status: experimental
description: Detects msiexec invocations using silent execution flags alongside references to temporary directories or user-writable locations. Attackers stage malicious MSI packages in these locations and invoke msiexec silently to avoid alerting the user. Patch management tools may legitimately trigger this pattern — exclude known patch management tool names if noise is excessive.
references:
    - https://attack.mitre.org/techniques/T1218/007/
    - https://lolbas-project.github.io/lolbas/Binaries/Msiexec/
author: dcrowder252
date: 2026/10/01
modified: 2026/10/01
tags:
    - attack.defense_evasion
    - attack.t1218.007
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith: '\msiexec.exe'
    selection_silent:
        CommandLine|contains:
            - '/quiet'
            - '/q'
    selection_path:
        CommandLine|contains:
            - '\temp\'
            - '\tmp\'
            - '\appdata\'
            - '\programdata\'
    condition: selection_process and selection_silent and selection_path
falsepositives:
    - Patch management tools such as PatchMyPC, SCCM, and Ivanti commonly invoke msiexec silently and write logs to temp directories — exclude known patch management tool names from the CommandLine filter to reduce noise
    - Establish a baseline of approved msiexec usage before alerting
level: medium
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - ComputerName
