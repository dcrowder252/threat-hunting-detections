title: Wmic Process Call Create Execution
id: 9d2e5f1b-3c7a-4e8d-b4f6-2a0c5e9d1b3f
status: experimental
description: Detects wmic invocations using the process call create method to execute processes locally or on remote systems. This capability is a well documented lateral movement and remote code execution technique that is rarely used in legitimate administrative scenarios outside of specific management frameworks. As of the September 2026 Security Update wmic.exe has been removed from Windows 11 versions 24H2 and 25H2 — detection remains important for environments running older Windows versions.
references:
    - https://attack.mitre.org/techniques/T1047/
    - https://lolbas-project.github.io/lolbas/Binaries/Wmic/
author: dcrowder252
date: 2026/10/01
modified: 2026/10/01
tags:
    - attack.execution
    - attack.t1047
    - attack.lateral_movement
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith: '\wmic.exe'
    selection_method:
        CommandLine|contains|all:
            - 'process'
            - 'call'
            - 'create'
    condition: selection_process and selection_method
falsepositives:
    - Legitimate administrative frameworks that use wmic process call create for remote management
    - Establish a baseline of approved wmic usage before alerting
level: high
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - ComputerName
