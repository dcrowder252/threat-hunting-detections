title: Msbuild Executing Project File from Suspicious Path
id: 6c1f8d3a-2e7b-4c9f-b3a6-1d0f4e8c1b2a
status: experimental
description: Detects msbuild invocations referencing project files in temporary directories or user-writable locations. Attackers craft malicious project files containing inline code that msbuild compiles and executes in memory. Legitimate msbuild usage references project files in standard development directories. Visual Studio is excluded as it regularly invokes msbuild with temp paths for NuGet package restore operations.
references:
    - https://attack.mitre.org/techniques/T1127/001/
    - https://lolbas-project.github.io/lolbas/Binaries/Msbuild/
author: dcrowder252
date: 2026/10/01
modified: 2026/10/01
tags:
    - attack.defense_evasion
    - attack.t1127.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith: '\msbuild.exe'
    filter_vs:
        Image|contains: 'Microsoft Visual Studio'
    selection_path:
        CommandLine|contains:
            - '\temp\'
            - '\tmp\'
            - '\appdata\'
            - '\programdata\'
            - '\users\'
    condition: selection_process and selection_path and not filter_vs
falsepositives:
    - Legitimate build automation that temporarily stages project files in user directories
    - Establish a baseline of approved msbuild usage before alerting
level: high
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - ComputerName
