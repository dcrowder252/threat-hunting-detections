title: Wmic Querying Security Software
id: 2b6e4a9f-5d1c-4e7f-c3d8-1a0f6e2b4c9d
status: experimental
description: Detects wmic invocations querying installed security software or antivirus products via WMI security center classes. Attackers commonly perform this reconnaissance to understand what security controls are present before attempting to disable or evade them. As of the September 2026 Security Update wmic.exe has been removed from Windows 11 versions 24H2 and 25H2 — detection remains important for environments running older Windows versions.
references:
    - https://attack.mitre.org/techniques/T1047/
    - https://lolbas-project.github.io/lolbas/Binaries/Wmic/
author: dcrowder252
date: 2026/10/01
modified: 2026/10/01
tags:
    - attack.discovery
    - attack.t1047
    - attack.t1518.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith: '\wmic.exe'
    selection_classes:
        CommandLine|contains:
            - 'AntiVirusProduct'
            - 'FirewallProduct'
            - 'AntiSpywareProduct'
            - 'AntiMalwareProduct'
            - 'SecurityCenter'
    condition: selection_process and selection_classes
falsepositives:
    - Legitimate administrative scripts that inventory security software across endpoints
    - Establish a baseline of approved wmic usage before alerting
level: medium
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - ComputerName
