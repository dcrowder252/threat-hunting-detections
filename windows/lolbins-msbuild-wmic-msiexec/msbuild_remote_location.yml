title: Msbuild Executing Project File from Remote Location
id: 8e3b5f1a-4d2c-4e7f-a5d9-2b0f3e8c1a4d
status: experimental
description: Detects msbuild invocations referencing project files from remote locations including external URLs or UNC paths. This technique allows attackers to execute malicious inline code from attacker-controlled infrastructure while keeping the payload off the local filesystem entirely. Legitimate msbuild usage does not typically reference external URLs or remote paths for project files.
references:
    - https://attack.mitre.org/techniques/T1127/001/
    - https://lolbas-project.github.io/lolbas/Binaries/Msbuild/
author: dcrowder252
date: 2026/10/01
modified: 2026/10/01
tags:
    - attack.defense_evasion
    - attack.t1127.001
    - attack.command_and_control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith: '\msbuild.exe'
    selection_remote:
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - '\\\\'
    condition: selection_process and selection_remote
falsepositives:
    - Legitimate CI/CD pipelines that reference project files on internal network shares
    - Establish a baseline of approved msbuild usage before alerting
level: high
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - ComputerName
