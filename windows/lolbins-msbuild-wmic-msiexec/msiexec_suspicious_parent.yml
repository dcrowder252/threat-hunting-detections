title: Msiexec Spawned by Suspicious Parent Process
id: 5c9b3e2a-1f7d-4c8e-d4a6-3b0f5e1c9b2a
status: experimental
description: Detects msiexec spawned by parent processes commonly associated with phishing-based initial access including Office applications and scripting engines. Legitimate software deployment typically involves dedicated deployment tool parent processes. Explorer.exe may generate more noise than other parent processes listed as users commonly launch installers directly through Explorer.
references:
    - https://attack.mitre.org/techniques/T1218/007/
    - https://lolbas-project.github.io/lolbas/Binaries/Msiexec/
author: dcrowder252
date: 2026/10/01
modified: 2026/10/01
tags:
    - attack.defense_evasion
    - attack.t1218.007
    - attack.initial_access
    - attack.t1566.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_process:
        Image|endswith: '\msiexec.exe'
    selection_parent:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
            - '\mshta.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\explorer.exe'
    condition: selection_process and selection_parent
falsepositives:
    - explorer.exe may generate more noise than other parent processes as users commonly launch installers directly through Explorer — exclude if volume is too high
    - Legitimate software installations invoked through scripting engines in approved administrative workflows
    - Establish a baseline of approved msiexec usage before alerting
level: medium
fields:
    - Image
    - CommandLine
    - ParentImage
    - User
    - ComputerName
